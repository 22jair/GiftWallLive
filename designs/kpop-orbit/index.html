<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-pop Orbit · Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080713;color:#fff;font-family:'Segoe UI',sans-serif}main{--glow:#ae88ff;position:relative;width:min(100vw,56.25dvh);height:100dvh;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#322450,transparent 50%),#080713;font-size:clamp(12px,2dvh,24px)}header{position:absolute;top:calc(15px + 3%);left:8%;right:8%;display:flex;justify-content:space-between;align-items:center}header b{font-size:1.6em;letter-spacing:-.05em}header span{font-size:.7em;color:#d0c2e5}.tunnel{position:absolute;inset:0;perspective:300px;overflow:hidden}.ring{position:absolute;left:15%;top:25%;width:70%;height:40%;border:1px solid var(--glow);border-radius:44%;box-shadow:0 0 20px color-mix(in srgb,var(--glow),transparent 70%),inset 0 0 20px #ffffff08;animation:travel 12s linear infinite;animation-delay:calc(var(--i)*-1.5s)}@keyframes travel{from{transform:translateZ(-700px) rotate(0deg);opacity:0}20%{opacity:.7}to{transform:translateZ(270px) rotate(65deg);opacity:0}}.core{position:absolute;top:40%;width:100%;text-align:center;color:#e4d8ff}.core small{font-size:.7em}.core h1{font-size:3.7em;font-weight:300;letter-spacing:-.07em;margin:0}.core p{font-size:.75em}.music{position:absolute;top:64%;left:8%;right:8%;border-top:1px solid #ffffff45;padding-top:1em}.music strong{font-size:1.4em}.music p{font-size:.8em;color:#c9bdd9}.bar{height:3px;background:#ffffff22}.bar i{display:block;width:40%;height:100%;background:var(--glow)}.tribute{position:absolute;inset:27% 9% auto;padding:2em 1em;text-align:center;border:1px solid var(--glow);background:#151024f2;border-radius:6px;box-shadow:0 0 45px #ae88ff44}.tribute[hidden]{display:none}.tribute b{display:block;font-size:2em;overflow:hidden;text-overflow:ellipsis}.tribute span{display:block;color:var(--glow);font-size:1.2em;margin:12px}.controls{position:absolute;bottom:4%;left:8%;right:8%;display:flex;flex-wrap:wrap;gap:8px}button{background:#211a36;border:1px solid #9c85bb;color:#fff;border-radius:20px;padding:10px;cursor:pointer;font:inherit;font-size:.65em}.controls small{width:100%;color:#afa0c6;font-size:.6em}button:focus-visible{outline:3px solid white}@media(prefers-reduced-motion:reduce){.ring{animation:none;transform:scale(calc(.2 + var(--i)*.25));opacity:.4}}
</style><link rel="stylesheet" href="./frames.css"><main><div class="tunnel" aria-hidden="true"></div><header><b>Orbit radio</b><span>Demo interactivo</span></header><div class="core"><small>Tu fandom, en otra dimensión</small><h1>borahae.</h1><p>Un viaje compartido, una canción a la vez.</p></div><section class="music"><strong id="song">Dynamite</strong><p id="artist">BTS · selección de ejemplo</p><div class="bar"><i></i></div></section><aside class="tribute" hidden aria-live="polite"><img class="tribute-frame" src="../../assets/images/orbit-bts-frame.png" alt=""><small>Gracias por iluminar esta órbita</small><b>@LunaArmy</b><span>BTS</span><small>Tu regalo nos lleva más lejos ✦</small></aside><div class="controls"><small>Simulación visual · sin audio ni regalos reales</small><button data-theme="BTS">Regalo BTS</button><button data-theme="BLACKPINK">Regalo BLACKPINK</button><button id="random">Selección aleatoria</button></div></main><script>
const main=document.querySelector('main');const tunnel=document.querySelector('.tunnel');for(let i=0;i<8;i++){const ring=document.createElement('div');ring.className='ring';ring.style.setProperty('--i',i);tunnel.append(ring)}let timer;let group='BTS';const songs={BTS:['Dynamite','Butter','Spring Day'],BLACKPINK:['How You Like That','Pink Venom','Shut Down']};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{group=b.dataset.theme;main.style.setProperty('--glow',group==='BTS'?'#ae88ff':'#ff83bb');document.querySelector('.core h1').textContent=group==='BTS'?'borahae.':'pink orbit.';const tribute=document.querySelector('.tribute');tribute.querySelector('span').textContent=group;tribute.querySelector('.tribute-frame').src='../../assets/images/orbit-'+group.toLowerCase()+'-frame.png';tribute.hidden=false;clearTimeout(timer);timer=setTimeout(()=>tribute.hidden=true,5000)});document.querySelector('#random').onclick=()=>{const list=songs[group];document.querySelector('#song').textContent=list[Math.floor(Math.random()*list.length)];document.querySelector('#artist').textContent=group+' · selección de ejemplo'};
</script></html>
