<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wireframe estructural del diseño Radio para GiftWallLive.">
  <title>GiftWallLive · Radio</title>
  <link rel="stylesheet" href="./radio.css">
</head>
<body>
  <!--
    Wireframe estructural del modo Radio.
    Esta página solo define las zonas de contenido. El diseño visual,
    los datos y las conexiones se añadirán en etapas posteriores.
  -->
  <main class="radio-layout" aria-label="GiftWallLive Radio">
    <div class="radio-frame">
      <!-- Zona superior: reproductor pequeño y mascota debajo -->
      <header class="radio-zone radio-now-playing" data-slot="now-playing">
        <h1>Ahora suena</h1>
        <p data-field="track-title">Canción actual</p>
      </header>

      <section class="radio-zone radio-mascot-zone" data-slot="mascot" aria-label="Mascota">
        <div class="radio-placeholder">
          <img class="radio-mascot-image" src="../../assets/images/radio-mascot.png" alt="Mascota gatita de radio con audífonos y micrófono">
        </div>
      </section>

      <div class="radio-bottom">
        <!-- Zona 2: columna inferior izquierda -->
        <section class="radio-zone radio-left" data-slot="left-column" aria-label="Columna izquierda">
          <h2>Cola Spotify</h2>
          <aside class="radio-queue" data-slot="queue" aria-label="Cola de Spotify">
            <ol data-list="queue-items">
              <li>Ahora · Solicitud</li>
              <li>Siguiente · Solicitud</li>
              <li>Turno 3</li>
              <li>Turno 4</li>
            </ol>
          </aside>
        </section>

        <!-- Zona 3: columna inferior derecha -->
        <section class="radio-zone radio-right" data-slot="right-column" aria-label="Columna derecha">
          <h2>Printers y cards</h2>
          <div class="radio-placeholder" data-slot="printer-cards">
            Printer y cards
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="./js/mascot-motion.js" defer></script>
  <script src="./js/mascot-demo.js" defer></script>
</body>
</html>
