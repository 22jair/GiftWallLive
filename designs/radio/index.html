<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wireframe estructural del diseño Radio para GiftWallLive.">
  <title>GiftWallLive · Radio</title>
  <style>
    /* Marco de wireframe: solo delimita la estructura, no es el diseño final. */
    body { margin: 0; min-height: 100vh; background: #160d24; }
    .radio-frame { width: min(100vw, 56.25dvh); min-height: 100dvh; margin: 0 auto; border: 0; background: #120f2b url('../../assets/images/radio-background.png') center top / cover no-repeat; }
    .radio-zone { padding: 12px; border-bottom: 1px solid #aaa; box-sizing: border-box; }
    .radio-zone:last-child { border-bottom: 0; }
    .radio-now-playing { min-height: 70px; }
    .radio-mascot-zone { min-height: 165px; }
    .radio-bottom { display: grid; grid-template-columns: 42% 58%; min-height: 650px; }
    .radio-bottom > .radio-zone + .radio-zone { border-left: 1px solid #aaa; }
    .radio-placeholder { min-height: 90px; border: 1px dashed #999; padding: 12px; }
    .radio-stage { min-height: 130px; }
    .radio-left, .radio-right { min-width: 0; }
  </style>
</head>
<body>
  <!--
    Wireframe estructural del modo Radio.
    Esta página solo define las zonas de contenido. El diseño visual,
    los datos y las conexiones se añadirán en etapas posteriores.
  -->
  <main class="radio-layout" aria-label="GiftWallLive Radio">
    <div class="radio-frame">
      <!-- Zona superior: reproductor pequeño y mascota debajo -->
      <header class="radio-zone radio-now-playing" data-slot="now-playing">
        <h1>Ahora suena</h1>
        <p data-field="track-title">Canción actual</p>
      </header>

      <section class="radio-zone radio-mascot-zone" data-slot="mascot" aria-label="Mascota">
        <h2>Mascota</h2>
        <div class="radio-placeholder">Espacio reservado para la mascota.</div>
      </section>

      <div class="radio-bottom">
        <!-- Zona 2: columna inferior izquierda -->
        <section class="radio-zone radio-left" data-slot="left-column" aria-label="Columna izquierda">
          <h2>Cola Spotify</h2>
          <aside class="radio-queue" data-slot="queue" aria-label="Cola de Spotify">
            <ol data-list="queue-items">
              <li>Ahora · Solicitud</li>
              <li>Siguiente · Solicitud</li>
              <li>Turno 3</li>
              <li>Turno 4</li>
            </ol>
          </aside>
        </section>

        <!-- Zona 3: columna inferior derecha -->
        <section class="radio-zone radio-right" data-slot="right-column" aria-label="Columna derecha">
          <h2>Printers y cards</h2>
          <div class="radio-placeholder" data-slot="printer-cards">
            Printer y cards
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
