<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio · Cabina</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100e21;color:#f5eefb;font:17px/1.5 'Segoe UI',sans-serif}main{max-width:760px;margin:8vh auto;padding:24px}h1{font-size:46px;letter-spacing:-2px;margin:0}p{color:#bfb2d0}section{margin:28px 0;padding:28px;background:#211b35;border-left:3px solid #d2a3ff;border-radius:0 20px 20px 0}h2{margin:0 0 12px;font-size:23px}label{display:block}input{width:100%;margin:10px 0 18px;padding:14px;background:#100e21;border:1px solid #736384;border-radius:8px;color:white;font:inherit}button,a{display:inline-block;padding:12px 18px;border-radius:8px;border:0;background:#dab6ff;color:#241334;font:600 16px 'Segoe UI',sans-serif;text-decoration:none;cursor:pointer}button.secondary{background:#3b304b;color:white;margin-left:8px}button:disabled{opacity:.5}output{display:block;margin-top:16px;color:#e1c8ff}footer{color:#a99ab8;font-size:14px}:focus-visible{outline:3px solid #ffe4a7;outline-offset:3px}
</style><main><h1>Tu cabina de radio</h1><p>Conecta el LIVE, elige la música y deja que la comunidad participe.</p>
<section><h2>TikTok LIVE</h2><form id="live"><label for="username">Usuario que está transmitiendo</label><input id="username" name="username" placeholder="usuario de TikTok" required pattern="@?[A-Za-z0-9_.]+"><button>Conectar LIVE</button><button type="button" class="secondary" id="stop">Detener</button></form><output id="tiktok" aria-live="polite">Consultando conexión…</output></section>
<section><h2>Spotify</h2><p>Autoriza tu cuenta. Al terminar volverás automáticamente a esta cabina.</p><a href="/spotify/login">Conectar Spotify</a><output id="spotify" aria-live="polite"></output></section><footer id="error" role="alert">Mantén el servidor abierto durante la transmisión.</footer></main>
<script>
const $=s=>document.querySelector(s);const labels={connected:'Conectado',connecting:'Conectando…',offline:'Desconectado',waiting:'Esperando reconexión',reconnecting:'Reconectando…',error:'Error'};
async function refresh(){try{const r=await fetch('/health');const d=await r.json();$('#tiktok').textContent=(labels[d.state]||d.state)+' '+(d.username||'')+(d.error?' — '+d.error:'');$('#spotify').textContent=d.spotify.authenticated?'Cuenta conectada':d.spotify.configured?'Pendiente de autorización':'Configura SPOTIFY_CLIENT_ID en server/.env';}catch{$('#error').textContent='No se puede contactar al servidor. Comprueba que npm start sigue abierto.'}}
async function action(path,body){const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw Error(d.error);$('#error').textContent='';await refresh()}catch(e){$('#error').textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}
$('#live').onsubmit=e=>{e.preventDefault();action('/tiktok/connect',{username:$('#username').value})};$('#stop').onclick=()=>action('/tiktok/stop');async function poll(){await refresh();setTimeout(poll,3000)}poll();
</script></html>
